# Analyze + test on every push to master and every PR.
#
# Some bundled assets and the databases the tests read are gitignored (built
# by the pipeline, hosted on R2), so the job fetches the SAME hosted files.
# The first run failed on exactly this: assets/data/hadeethenc/ was empty.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rafeeq_app
    env:
      CONTENT: https://pub-39dbef68a1a845d5ba669b43a59516b9.r2.dev
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is built and released with.
          flutter-version: 3.38.7
          cache: true

      - name: Fetch the gitignored content from R2
        # R2 answers a request with no User-Agent with 403 (TRAPS.md #19).
        # Bundled zips (pubspec assets) are placed as they are; the two
        # databases the tests open are unpacked. Every hosted file here was
        # SHA-1-compared with the local copy on 2026-09-27: all identical.
        run: |
          get() { curl -fsSL -A "rafeeq-ci (github.com/tito423/Rafeeq-Al-Darb)" -o "$2" "$CONTENT/$1"; }
          mkdir -p assets/data/hadeethenc
          for l in ar en es fr pt ru ur; do
            get "hadeethenc/$l.zip" "assets/data/hadeethenc/hadeethenc_$l.zip"
          done
          get hadith/hadith.zip assets/data/hadith.zip
          unzip -o -q assets/data/hadith.zip -d assets/data
          get sciences/v2/quran_sciences.zip /tmp/sciences.zip
          unzip -o -q /tmp/sciences.zip -d assets/data
          ls -l assets/data/*.db assets/data/*.zip assets/data/hadeethenc

      - run: flutter pub get

      - run: flutter analyze lib test

      - run: flutter test

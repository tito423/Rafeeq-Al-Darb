<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kids stories renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
'use strict';
// Timeline: scene i occupies exactly [start_i, start_i + seconds_i) from
// timing.json, so the narration can be laid on scene boundaries unchanged.
// Cross-fades straddle a boundary (half before, half after) and never move it.
const XF = 0.25;         // half of a cross-fade, seconds (v2: 0.5 s cuts, no long ghosting)
const FADE_IN = 0.7, FADE_OUT = 1.0;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const mk = () => { const b = document.createElement('canvas'); b.width = K.W; b.height = K.H; return b; };
const bufA = mk(), bufB = mk();
let SCENES = null, T = null, starts = [], total = 0;

window.loadStory = (story) => new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = `../${story}/scenes.js`;
  s.onload = () => { SCENES = window.STORY_SCENES; resolve(SCENES.length); };
  s.onerror = () => reject(new Error('cannot load ' + s.src));
  document.head.appendChild(s);
});

window.setWords = (w) => { K.WORDS = w && w.scenes ? w.scenes : null; return !!K.WORDS; };

window.init = (timing) => {
  if (!SCENES) throw new Error('story not loaded');
  if (timing.length !== SCENES.length) throw new Error(`timing.json has ${timing.length} entries, story has ${SCENES.length} scenes`);
  T = timing.map((e, i) => {
    if (e.scene !== i + 1) throw new Error(`timing.json entry ${i} is scene ${e.scene}, expected ${i + 1}`);
    if (!(e.seconds > 0)) throw new Error(`scene ${e.scene}: seconds must be > 0`);
    return e.seconds;
  });
  starts = []; total = 0;
  for (const d of T) { starts.push(total); total += d; }
  return total;
};

function drawScene(c, i, t) {
  const sc = SCENES[i], d = T[i], p = K.clamp(t / d);
  c.save();
  c.fillStyle = '#000'; c.fillRect(0, 0, K.W, K.H);
  let [z, x, y, rot] = sc.cam ? sc.cam(p, t, d) : [1, K.W / 2, K.H / 2, 0];
  // v2: the camera is never still - a slow hand-held breath on top of every move
  x += 5 * Math.sin(t * 0.41 + i * 1.3) + 2.5 * Math.sin(t * 0.97 + i);
  y += 3.5 * Math.sin(t * 0.53 + i * 2.1) + 1.5 * Math.sin(t * 1.21 + i);
  z = Math.max(1, z) * (1 + 0.006 * Math.sin(t * 0.33 + i));
  rot = (rot || 0) + 0.0025 * Math.sin(t * 0.37 + i * 0.7);
  const hw = K.W / (2 * z), hh = K.H / (2 * z);
  x = K.clamp(x, hw, K.W - hw); y = K.clamp(y, hh, K.H - hh);
  K.CAM = { x, y, z };
  c.translate(K.W / 2, K.H / 2); c.rotate(rot); c.scale(z, z); c.translate(-x, -y);
  sc.draw(c, t, d, p);
  c.restore();
}

// Film grain: one seeded noise tile, shifted every frame (deterministic).
const grain = (() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gc = g.getContext('2d'), im = gc.createImageData(256, 256), r = K.rng(4242);
  for (let i = 0; i < im.data.length; i += 4) { const v = 96 + r() * 64; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gc.putImageData(im, 0, 0);
  return g;
})();
function finish(c, g) {
  // warm light from the upper left, cooler shade lower right: one palette
  const lg = c.createLinearGradient(0, 0, K.W, K.H);
  lg.addColorStop(0, 'rgba(255,214,160,0.07)'); lg.addColorStop(1, 'rgba(40,30,70,0.07)');
  c.save(); c.globalCompositeOperation = 'soft-light'; c.fillStyle = lg; c.fillRect(0, 0, K.W, K.H);
  c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.05;
  const f = Math.floor(g * 30), ox = (f * 97) % 256, oy = (f * 61) % 256;
  c.translate(-ox, -oy);
  for (let x = 0; x < K.W + 256; x += 256) for (let y = 0; y < K.H + 256; y += 256) c.drawImage(grain, x, y);
  c.restore();
}
function vignette(c) {
  const g = c.createRadialGradient(K.W / 2, K.H / 2, K.H * 0.45, K.W / 2, K.H / 2, K.H * 0.95);
  g.addColorStop(0, 'rgba(20,10,20,0)'); g.addColorStop(1, 'rgba(20,10,20,0.22)');
  c.fillStyle = g; c.fillRect(0, 0, K.W, K.H);
}

// Global time -> frame. Returns a PNG data URL when asked for one.
window.renderAt = (g, png = true) => {
  const n = T.length;
  let i = 0;
  while (i < n - 1 && g >= starts[i] + T[i]) i++;
  const end = starts[i] + T[i];
  let A = i, B = -1, a = 0;
  if (i < n - 1 && g > end - XF) { B = i + 1; a = K.smooth((g - (end - XF)) / (2 * XF)); }
  else if (i > 0 && g < starts[i] + XF) { A = i - 1; B = i; a = K.smooth((g - (starts[i] - XF)) / (2 * XF)); }
  const ca = bufA.getContext('2d');
  drawScene(ca, A, g - starts[A]);
  ctx.globalAlpha = 1;
  ctx.drawImage(bufA, 0, 0);
  if (B >= 0) {
    const cb = bufB.getContext('2d');
    drawScene(cb, B, g - starts[B]);
    // the incoming shot pushes in slightly as it arrives (a move, not a ghost)
    const zs = 1 + 0.04 * (1 - a);
    ctx.globalAlpha = a;
    ctx.drawImage(bufB, K.W / 2 * (1 - zs), K.H / 2 * (1 - zs), K.W * zs, K.H * zs);
    ctx.globalAlpha = 1;
  }
  vignette(ctx);
  finish(ctx, g);
  const f = Math.min(K.smooth(g / FADE_IN), K.smooth((total - g) / FADE_OUT));
  if (f < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - f})`; ctx.fillRect(0, 0, K.W, K.H); }
  return png ? cv.toDataURL('image/png') : null;
};
window.__engineReady = true;
</script>
</body>
</html>

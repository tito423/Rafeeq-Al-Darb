name: rafeeq_app
description: "Rafeeq Al-Darb — Quran, Adhkar, Prayer Times, Hadith Library (offline-first, zero mock data)"
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Typography
  google_fonts: ^6.2.1

  # Storage & DB
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  sqflite: ^2.4.2

  # Networking & downloads
  dio: ^5.11.0
  http: ^1.2.2
  archive: ^4.2.0

  # Audio playback (with background support)
  just_audio: ^0.9.41
  just_audio_background: ^0.0.1-beta.12

  # Notifications & alarms (prayer Adhan)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.1
  flutter_timezone: ^3.0.0

  # Location (prayer times & qibla)
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  # Real reverse-geocoding for the Home prayer card's location line (P3‑22)
  # — geolocator only returns lat/lon, this turns that into a real city
  # name via the platform's own Geocoder, no third-party API/key needed.
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Localization
  easy_localization: ^3.0.7+1
  intl: ^0.20.2
  hijri: ^3.0.1

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # PDF viewer (Islamic library)
  syncfusion_flutter_pdfviewer: ^33.2.13

  # Background video for the video-mode Adhan (P2‑7) — clip downloaded on
  # demand, played muted + looped behind the karaoke text.
  video_player: ^2.9.2

  # File picking (custom Adhan audio)
  file_picker: ^11.0.3

  # Keep screen awake during Adhan
  wakelock_plus: ^1.5.2

  url_launcher: ^6.3.2

  # Share an ayah card as an image (P2‑8)
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/data/quran_local.db
    - assets/data/quran_sciences.db
    - assets/data/hadith.db
    - assets/data/mushaf/
    - assets/data/catalogs/
    - assets/audio/adhan/
    # P3‑49: the owner's AI-generated splash video (Gemini watermark removed)
    # + its badge-fallback art, put back at his request.
    - assets/branding/
    # P3‑41: the default mushaf edition (Hafs/KFQC), all 604 pages, bundled
    # so it's usable fully offline the moment the app installs — see
    # MushafPageService's own comment for how these get served ahead of
    # the cache/network fallback.
    - assets/mushaf/hafs_kfqc/
    # assets/icon/ is intentionally NOT bundled — the PNGs there are consumed
    # by flutter_launcher_icons at build time only, never at runtime. Bundling
    # them would just bloat the install.
    # P3‑43 #12: the `google_fonts` package fetches a font over the network
    # on first use unless a matching file already sits in the asset bundle
    # (see AppTypography's own doc comment) — bundling Cairo's real static
    # weight instances here means the app's own UI chrome text never
    # depends on a network round-trip, honoring the offline-first rule the
    # same way AmiriQuran already does for the Quran text itself.
    - assets/fonts/google_fonts/

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/app_icon.png'
  adaptive_icon_background: '#071625'
  adaptive_icon_foreground: 'assets/icon/app_icon_foreground.png'
  background_color_ios: '#0C2C29'
  remove_alpha_ios: true
  min_sdk_android: 21

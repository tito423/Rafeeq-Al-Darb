name: rafeeq_app
description: "Rafeeq Al-Darb â€” Quran, Adhkar, Prayer Times, Hadith Library (offline-first, zero mock data)"
publish_to: 'none'

version: 3.30.0+31

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Typography
  google_fonts: ^6.2.1

  # Storage & DB
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  sqflite: ^2.4.2

  # Networking & downloads
  dio: ^5.11.0
  http: ^1.2.2
  archive: ^4.2.0

  # Audio playback (with background support)
  just_audio: ^0.9.41
  just_audio_background: ^0.0.1-beta.12

  # Notifications & alarms (prayer Adhan)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.1
  flutter_timezone: ^3.0.0

  # Location (prayer times & qibla)
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  # Real reverse-geocoding for the Home prayer card's location line (P3â€‘22)
  # â€” geolocator only returns lat/lon, this turns that into a real city
  # name via the platform's own Geocoder, no third-party API/key needed.
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Localization
  easy_localization: ^3.0.7+1
  intl: ^0.20.2
  hijri: ^3.0.1

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Background video for the video-mode Adhan (P2â€‘7) â€” clip downloaded on
  # demand, played muted + looped behind the karaoke text.
  video_player: ^2.9.2

  # File picking (custom Adhan audio)
  file_picker: ^11.0.3

  # Keep screen awake during Adhan
  wakelock_plus: ^1.5.2

  url_launcher: ^6.3.2

  # Share an ayah card as an image (P2â€‘8)
  share_plus: ^12.0.2

  # P3â€‘56: native splash held until init completes. The OS-drawn splash stays
  # on screen through the Flutter engine warmup and main()'s bootstrap
  # (FlutterNativeSplash.preserve) and is lifted only when the app is actually
  # ready (FlutterNativeSplash.remove) â€” killing the iconâ†’flashâ†’iconâ†’video
  # glitch the old hand-built splash produced.
  flutter_native_splash: ^2.4.4
  background_downloader: ^9.5.9
  vibration: ^3.1.8
  adhan: ^2.0.0+1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/data/quran_local.db
    - assets/data/quran_sciences.db
    - assets/data/quotes.json
    - assets/data/quote_backgrounds.json
    # «في مثل هذا اليوم» — 366 days x 12 events, built by
    # scripts/fetch_on_this_day.py from Wikimedia's onthisday feed (CC BY-SA)
    # and stored gzipped, so the card works with no network at all.
    - assets/data/on_this_day_ar.json
    - assets/data/on_this_day_en.json
    # Six of the seven: Wikimedia's onthisday feed exists in these languages
    # and answers 404 for Urdu, which falls back to English.
    - assets/data/on_this_day_es.json
    - assets/data/on_this_day_fr.json
    - assets/data/on_this_day_pt.json
    - assets/data/on_this_day_ru.json
    # The same idea keyed by the HIJRI day, built by
    # scripts/fetch_on_this_day_hijri.py from Arabic Wikipedia's own per-Hijri-
    # day pages. Arabic only: English Wikipedia has no such pages at all.
    - assets/data/on_this_day_hijri_ar.json
    - assets/quote_backgrounds/
    - assets/data/mushaf/
    - assets/mushaf_covers/
    - assets/data/catalogs/
    # The Hadeeth Encyclopaedia, all seven language packs, bundled (3.17.0).
    - assets/data/hadeethenc/
    - assets/audio/adhan/
    # P3â€‘49: the owner's AI-generated splash video (Gemini watermark removed)
    # + its badge-fallback art, put back at his request.
    - assets/branding/
    - assets/diagrams/
    # The default mushaf's 604 pages used to be bundled here (P3-41). They were
    # 350 MB - almost the whole APK - and the owner asked for them out; they
    # now download and cache as they are read, like every other edition.
    - assets/icons/
    # assets/icon/ is intentionally NOT bundled â€” the PNGs there are consumed
    # by flutter_launcher_icons at build time only, never at runtime. Bundling
    # them would just bloat the install.
    # P3â€‘43 #12: the `google_fonts` package fetches a font over the network
    # on first use unless a matching file already sits in the asset bundle
    # (see AppTypography's own doc comment) â€” bundling Cairo's real static
    # weight instances here means the app's own UI chrome text never
    # depends on a network round-trip, honoring the offline-first rule the
    # same way AmiriQuran already does for the Quran text itself.
    - assets/fonts/google_fonts/

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/app_icon.png'
  adaptive_icon_background: '#081F4F'
  adaptive_icon_foreground: 'assets/icon/app_icon_foreground.png'
  background_color_ios: '#0C2C29'
  remove_alpha_ios: true
  min_sdk_android: 21

# Native splash config. The colour matches `AppColors.night` (#071625),
# the same ground the Flutter SplashScreen paints.
#
# The image is the mark ALREADY CLIPPED TO ITS CIRCLE, on transparency
# (app_mark_circle.png, cut from app_mark.png at centre 440,454 r=403).
# app_mark.png is that emblem on a light grey SQUARE plate, and the OS
# draws what it is given: boot showed a grey square, then a smaller
# circle somewhere else, then the intro. The owner watched it and said
# the square goes and the circle stays. Pre-masking is the only way to
# say that to the platform - Android 12+ always draws an icon, and
# never crops the one it is handed.
#
# Regenerate the native drawables after any change here with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # NO ICON HERE ANY MORE, ON PURPOSE. «اول ما التطبيق يفتح يجيب ايقونة
  # التطبيق الدائرية وبعدها الاسبلاش اسكرين» — the OS drew the icon, then the
  # app drew its own beat, and the boot read as two separate openings.
  #
  # Android 12 and up ALWAYS draw a splash icon; the only way to be rid of it
  # is to hand the platform a fully transparent one, which is what
  # `splash_blank.png` is. What is left is a flat colour — and the colour is
  # the intro clip's own opening frame (its median pixel, #2B516B), so the
  # window the OS paints and the first frame of the video are the same
  # colour and the hand-off has nothing to see.
  color: "#2B516B"
  image: assets/branding/splash_blank.png
  android_12:
    color: "#2B516B"
    image: assets/branding/splash_blank.png
  android: true
  ios: true
  web: false

name = "rafeeq-sync-backend"
main = "src/index.ts"
compatibility_date = "2024-09-09"

# Local validation only until the owner approves Worker deployment. Check this
# account-wide namespace is unused before deploying; keys also carry a prefix.
[[ratelimits]]
name = "REVIEW_RATE_LIMITER"
namespace_id = "3870018"

[ratelimits.simple]
limit = 120
period = 60

[[d1_databases]]
binding = "DB"
database_name = "rafeeq_sync_db"
database_id = "235f64ec-0d6f-4048-9a59-bdfe4da7a671"
